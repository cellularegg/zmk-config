# Sweep Bling LP on nRF52840 SuperMini (nice!nano v2 compatible).
# ZMK v0.3 uses the board name nice_nano_v2.
---
include:
  # Normal split firmware
  - board: nice_nano_v2
    shield: cradio_left
  - board: nice_nano_v2
    shield: cradio_right

  # Right half as a standalone keyboard, for testing without the left half.
  # Connect over USB (or pair via Bluetooth) and every right-half key types directly.
  - board: nice_nano_v2
    shield: cradio_right
    cmake-args: -DCONFIG_ZMK_SPLIT=n
    artifact-name: cradio_right_standalone_test

  # Clears Bluetooth bonds; flash to both halves if they stop pairing.
  - board: nice_nano_v2
    shield: settings_reset
