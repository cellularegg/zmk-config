# Sweep Bling LP (cradio shield) on nRF52840 SuperMini (nice!nano v2 clone)
# Applies to both halves. Add shared Kconfig options here.

# nRF52840 SuperMini clones often have a missing/unreliable 32.768 kHz crystal,
# which breaks Bluetooth while USB still works. Use the internal RC oscillator.
CONFIG_CLOCK_CONTROL_NRF_K32SRC_RC=y

# Bluetooth/USB name. ZMK only sets one for cradio_left, so standalone builds of
# the right half would otherwise advertise with no name (hidden in macOS settings).
CONFIG_ZMK_KEYBOARD_NAME="Sweep"

# Mouse keys (Mouse layer)
CONFIG_ZMK_POINTING=y

# Report the right half's battery to the host too. The left (central) half fetches
# it and exposes it as a second Battery Level characteristic. macOS only shows the
# first one (left half); macos/sweep-battery reads both.
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y
